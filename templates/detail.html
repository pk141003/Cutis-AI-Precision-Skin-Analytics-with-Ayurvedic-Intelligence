<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Diagnostic Intake | CutisAI</title>

<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest"></script>

<style>
:root{
    --brand:#4f46e5;
    --brand-light:#eef2ff;
    --brand-dark:#3730a3;
    --accent:#0ea5e9;
    --slate-50:#f8fafc;
    --slate-200:#e2e8f0;
    --slate-900:#0f172a;
    --danger:#ef4444;
    --shadow:0 10px 25px rgba(0,0,0,0.08);
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Plus Jakarta Sans',sans-serif;
}

body{
    background:var(--slate-50);
    color:var(--slate-900);
}

.navbar{
    position:fixed;
    top:0;
    width:100%;
    height:70px;
    background:rgba(255,255,255,0.92);
    backdrop-filter:blur(14px);
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:0 40px;
    border-bottom:1px solid var(--slate-200);
    z-index:1000;
}

.brand{
    display:flex;
    align-items:center;
    gap:10px;
    font-size:18px;
    font-weight:900;
    color:var(--brand);
}

.user-nav{
    position:relative;
    display:flex;
    align-items:center;
    gap:10px;
    cursor:pointer;
}

.user-box{
    display:flex;
    align-items:center;
    gap:8px;
    padding:6px 12px;
    background:var(--brand-light);
    border-radius:10px;
    font-weight:700;
    font-size:0.85rem;
}

.dropdown{
    position:absolute;
    top:45px;
    right:0;
    background:white;
    border:1px solid var(--slate-200);
    border-radius:12px;
    box-shadow:var(--shadow);
    width:170px;
    display:none;
    overflow:hidden;
}

.dropdown a{
    display:flex;
    align-items:center;
    gap:8px;
    padding:10px;
    text-decoration:none;
    color:var(--slate-900);
    font-size:0.85rem;
}

.dropdown a:hover{
    background:var(--brand-light);
}

.dropdown.show{
    display:block;
}

.btn-submit{
    width:100%;
    padding:16px;
    border-radius:14px;
    background:var(--brand);
    color:white;
    font-weight:900;
    font-size:15px;
    border:none;
    cursor:pointer;
}

.container{
    max-width:950px;
    margin:auto;
    padding:120px 20px 50px;
}

.header{
    text-align:center;
    margin-bottom:30px;
}

.header h1{
    font-size:38px;
    font-weight:900;
}

.header span{
    color:var(--brand);
}

.card{
    background:white;
    padding:24px;
    border-radius:22px;
    box-shadow:var(--shadow);
    margin-bottom:20px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:15px;
}

@media(max-width:768px){
    .grid{grid-template-columns:1fr;}
}

label{
    font-size:11px;
    font-weight:900;
    text-transform:uppercase;
    opacity:0.6;
}

input, select{
    width:100%;
    padding:12px;
    border-radius:12px;
    border:1px solid var(--slate-200);
    background:var(--slate-50);
    margin-top:6px;
}

.upload{
    border:2px dashed var(--slate-200);
    border-radius:18px;
    padding:30px;
    text-align:center;
    cursor:pointer;
}

.preview{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(110px,1fr));
    gap:10px;
    margin-top:15px;
}

.preview img{
    width:100%;
    border-radius:10px;
}
</style>
</head>

<body>

<div class="navbar">

    <div class="brand">
        <i data-lucide="activity"></i>
        CutisAI
    </div>

    <div class="user-nav" onclick="toggleDropdown()">

        <i data-lucide="user" size="18"></i>

        <div class="user-box">
            {{ user.fullname }}
        </div>

        <i data-lucide="chevron-down" size="18"></i>

        <div class="dropdown" id="userDropdown">

            <a href="/dashboard">
                <i data-lucide="layout-dashboard"></i>
                Dashboard
            </a>

            <a href="/logout" style="color:#ef4444;">
                <i data-lucide="log-out"></i>
                Logout
            </a>

        </div>
    </div>

</div>

<div class="container">

<div class="header">
    <h1>AI Diagnostic <span>Intake</span></h1>
    <p>Provide clinical details for analysis</p>
</div>

<form action="/analyze" method="POST" enctype="multipart/form-data">

<div class="card">
    <h3>Patient Details</h3>

    <div class="grid">
        <div>
            <label>Full Name</label>
            <input type="text" value="{{ user.fullname }}" readonly>
        </div>

        <div>
            <label>Age</label>
            <input type="number" name="age" required>
        </div>

        <div>
            <label>Gender</label>
            <select name="gender" required>
                <option disabled selected>Select</option>
                <option>Male</option>
                <option>Female</option>
                <option>Other</option>
            </select>
        </div>
    </div>
</div>

<div class="card">
    <h3>Lesion Details</h3>

    <div class="grid">
        <div>
            <label>Area</label>
            <select name="area" required>
                <option disabled selected>Select</option>
                <option>Face</option>
                <option>Neck</option>
                <option>Back</option>
                <option>Arms</option>
                <option>Legs</option>
            </select>
        </div>

        <div>
            <label>Duration</label>
            <select name="duration" required>
                <option disabled selected>Select</option>
                <option>1 week</option>
                <option>1–4 weeks</option>
                <option>1–3 months</option>
                <option>6 months</option>
            </select>
        </div>

        <div>
            <label>Sensation</label>
            <select name="sensation" required>
                <option disabled selected>Select</option>
                <option>Itching</option>
                <option>Pain</option>
                <option>Burning</option>
                <option>Bleeding</option>
            </select>
        </div>
    </div>
</div>

<div class="card">
    <h3>Upload Images</h3>

    <div class="upload" onclick="document.getElementById('img').click()">
        <i data-lucide="upload-cloud"></i>
        <p><b>Click to upload images</b></p>

        <input type="file" id="img" name="images" multiple hidden onchange="previewImages(this)" required>
    </div>

    <div class="preview" id="preview"></div>
</div>

<button class="btn-submit">Analyze Skin →</button>

</form>
</div>

<script>
lucide.createIcons();

function toggleDropdown(){
    document.getElementById("userDropdown").classList.toggle("show");
}

window.addEventListener("click", function(e){
    if(!e.target.closest(".user-nav")){
        document.getElementById("userDropdown").classList.remove("show");
    }
});

function previewImages(input){
    let preview = document.getElementById("preview");
    preview.innerHTML = "";

    Array.from(input.files).forEach(file=>{
        let reader = new FileReader();
        reader.onload = e=>{
            let img = document.createElement("img");
            img.src = e.target.result;
            preview.appendChild(img);
        }
        reader.readAsDataURL(file);
    });
}
</script>

</body>
</html>
